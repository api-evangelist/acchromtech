aid: acchromtech
name: Acchromtech
description: 'Acchromtech (Acchrom Tech, legally Huapu Instrument (Beijing) Technology
  Co., Ltd.) is a Beijing-based analytical-instrument company founded in 2015 that
  develops, manufactures and services high-end chromatographic separation products:
  high-performance and ultra-high-performance liquid chromatography systems, triple-quadrupole
  LC-MS/MS, preparative and online-SPE instruments, and Alphasil / StarCore / SelectPrep
  / Marsil chromatographic columns and consumables. It also ships Chromloong, a self-developed
  chromatography data system (CDS) for chromatographic information management with
  distributed storage, network deployment and full-link audit. Its products are used
  in pharmaceutical, food-safety, environmental, disease-control, clinical-testing,
  inspection-and-quarantine, petrochemical and academic laboratories. It publishes
  no public API, SDK, developer portal or machine-readable contract; Chromloong is
  distributed as an end-user laboratory product.'
